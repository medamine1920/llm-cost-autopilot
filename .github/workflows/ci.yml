name: CI                          

on:                               
  push:
    branches: [main]              
  pull_request:                   

jobs:                             
  test:
    runs-on: ubuntu-latest        

    steps:                       
      - name: Check out code
        uses: actions/checkout@v4       

      - name: Set up Python
        uses: actions/setup-python@v5
        with:                            
          python-version: "3.12"         

      - name: Install dependencies
        run: |                           
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest

    permissions:                    # NEW: this job needs write access to
      contents: read                # GitHub Packages — by default the token
      packages: write               # can only read the repo

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}          # your GitHub username, auto-filled
          password: ${{ secrets.GITHUB_TOKEN }}  # auto-generated per run — you

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .                             # build from repo root
          push: ${{ github.event_name == 'push' }}   # push ONLY on main pushes,

          tags: |
            ghcr.io/medamine1920/llm-cost-autopilot:latest
            ghcr.io/medamine1920/llm-cost-autopilot:${{ github.sha }}

  deploy:
    
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'       # never deploy from PRs

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/apps/llm-cost-autopilot
            docker compose pull
            docker compose up -d
            sleep 3
            curl -f localhost:8000/health