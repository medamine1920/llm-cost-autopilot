name: CI                          

on:                               
  push:
    branches: [main]              
  pull_request:                   

jobs:                             
  test:
    runs-on: ubuntu-latest        

    steps:                       
      - name: Check out code
        uses: actions/checkout@v4       

      - name: Set up Python
        uses: actions/setup-python@v5
        with:                            
          python-version: "3.12"         

      - name: Install dependencies
        run: |                           
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    needs: test                   
    runs-on: ubuntu-latest        

    steps:
      - name: Check out code
        uses: actions/checkout@v4        

      - name: Build Docker image
        run: docker build -t llm-cost-autopilot:ci .